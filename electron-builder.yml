appId: com.ucli.app
asar: false
productName: UCLI
electronDist: node_modules/electron/dist
directories:
  output: dist
  buildResources: build
publish:
  provider: github
  owner: AllernChen
  repo: ucli
# Skip native module rebuild — node-pty ships prebuilds for all platforms.
# electron-rebuild tries to recompile via node-gyp which fails without Python
# and breaks on paths with spaces.
npmRebuild: false
afterPack: scripts/fix-node-pty-permissions.cjs
files:
  - out/**/*
  - resources/**/*
  # sql.js (pure WASM — must be available at runtime for the main process)
  - node_modules/sql.js/**
  # node-pty (native module for terminal PTY support)
  - node_modules/node-pty/**
# Bundled PreToolUse hook runner (must be runnable via `node <path>` at runtime).
extraResources:
  - from: resources/
    to: resources/
win:
  icon: resources/icons/ucli.png
  target:
    - nsis
    - portable
  sign: false
  forceCodeSigning: false
mac:
  icon: resources/icons/ucli.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  identity: null
nsis:
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: build/installer.nsh
portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}
