name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-26-intel
            dist_command: npm run dist:mac
            verify_command: npm run verify:release -- --platform darwin --arch x64
            artifact_name: release-macos
            artifact_path: |
              dist/*.dmg
              dist/*.dmg.blockmap
              dist/*.zip
              dist/*.zip.blockmap
              dist/latest-mac.yml
          - platform: Windows
            os: windows-2022
            dist_command: npm run dist:win
            verify_command: npm run verify:release -- --platform win32 --arch x64
            artifact_name: release-windows
            artifact_path: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: ${{ matrix.dist_command }}
      - run: ${{ matrix.verify_command }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* \
              --title "UCLI ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag
          fi
